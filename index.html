<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Implementation Module Dashboard — Okie Dokie</title>
<link rel="icon" type="image/png" href="https://okiedokie-erp-images.s3.ap-south-1.amazonaws.com/Okie%20Dokie/2025/12/sourceURL/26aebcbe10f4ac5a3e8b-611ed1b9032568edd4f3-Okie_Dokie_App_icon__2___2_-removebg-preview.png">
<style>
:root {
  --bg:        #f8fafc;
  --surface:   #ffffff;
  --border:    #e2e8f0;
  --text:      #0f172a;
  --muted:     #64748b;
  --accent:    #e8571a;
  --accent-dk: #c44213;
  --orange:    #e8571a;
  --col-head:  #334155;   /* medium slate — readable, not pitch black */
  --col-fg:    #f1f5f9;
  --col-sub:   #94a3b8;
  --row-head:  #ffffff;
  --warn:      #dc2626;
  --gold:      #fef3c7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); font-size: 13px;
}

/* ── Header ── */
header {
  background: var(--orange); color: #fff;
  padding: 11px 20px; display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 40;
  box-shadow: 0 2px 8px rgba(232,87,26,.3);
}
header img.logo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
header .tb { flex: 1; min-width: 0; }
header h1  { font-size: 15px; font-weight: 700; line-height: 1.2; }
header .sub { font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: .06em; }
.hstats { display: flex; gap: 14px; font-size: 12px; color: rgba(255,255,255,.7); }
.hstats b { color: #fff; }

/* ── Toolbar ── */
.toolbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 7px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  position: sticky; top: 57px; z-index: 39;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.toolbar input {
  border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 10px; font-size: 12px; width: 170px; outline: none;
  background: var(--bg); color: var(--text);
}
.toolbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(232,87,26,.15); }

.pill-group { display: flex; gap: 3px; }
.pill {
  border: 1px solid var(--border); background: var(--bg); color: var(--muted);
  border-radius: 20px; padding: 4px 10px; font-size: 11px; cursor: pointer; white-space: nowrap;
  transition: all .15s;
}
.pill:hover  { border-color: var(--accent); color: var(--accent); }
.pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.sep { width: 1px; background: var(--border); margin: 0 2px; align-self: stretch; }
.spacer { flex: 1; }

.legend { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.li { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.swatch { width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,.08); flex-shrink: 0; }

.export-btn {
  background: var(--col-head); color: #fff; border: none;
  border-radius: 6px; padding: 5px 11px; font-size: 11px; cursor: pointer;
  white-space: nowrap; transition: background .15s;
}
.export-btn:hover { background: #000; }

/* ── Min-usage filter toggle ── */
.min-filter {
  display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted);
}
.min-filter select {
  border: 1px solid var(--border); background: var(--bg); border-radius: 5px;
  padding: 3px 6px; font-size: 11px; color: var(--text); outline: none; cursor: pointer;
}

/* ── Table wrap ── */
.wrap { overflow: auto; height: calc(100vh - 106px); }

table { border-collapse: collapse; white-space: nowrap; min-width: 100%; }

/* Column header row */
thead { position: sticky; top: 0; z-index: 20; }

th.corner {
  position: sticky; left: 0; z-index: 25;
  background: var(--col-head); width: 320px; padding: 6px 14px;
  font-size: 10px; color: var(--col-sub); text-align: left;
  border-right: 1px solid rgba(255,255,255,.1);
}

th.mh {
  background: var(--col-head);
  padding: 8px 4px 6px; width: 52px; min-width: 52px; height: 140px;
  vertical-align: bottom; border-left: 1px solid rgba(255,255,255,.08); cursor: default;
}
th.mh div.rot {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 11px; font-weight: 500; color: var(--col-fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-height: 110px; line-height: 1.3;
}
th.mh div.rot span.cnt {
  display: block; font-size: 9px; color: var(--col-sub); font-weight: 400; margin-top: 3px;
  writing-mode: vertical-rl; transform: rotate(180deg);
}

/* Client rows */
td.cc {
  position: sticky; left: 0; background: var(--row-head); z-index: 10;
  border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 6px 14px; width: 320px; min-width: 320px;
  white-space: normal; word-break: break-word;
  transition: background .1s;
}
tr:hover td.cc { background: #fff7f5; }
tr:hover td     { background: #fafafa; }

td.cc a { text-decoration: none; color: var(--text); font-weight: 600; font-size: 12px; }
td.cc a:hover { color: var(--accent); text-decoration: underline; }

.cmeta { display: flex; gap: 6px; margin-top: 3px; flex-wrap: wrap; align-items: center; }
.owner { font-size: 10px; color: var(--muted); }
.due   { font-size: 10px; padding: 1px 5px; border-radius: 3px;
         background: #fff7ed; color: #92400e; font-weight: 500;
         border: 1px solid #fed7aa; }
.due.ov { background: #fef2f2; color: var(--warn); border-color: #fecaca; }
.nbadge {
  display: inline-block; background: var(--accent); color: #fff;
  border-radius: 10px; font-size: 9px; font-weight: 700; padding: 1px 5px;
  margin-left: 5px; vertical-align: middle;
}

/* Attention: clients with few modules */
tr.attn td.cc { border-left: 3px solid var(--accent); }

/* ── Module cells ── */
td.mc {
  border-bottom: 1px solid var(--border); border-left: 1px solid #f5ece8;
  width: 52px; min-width: 52px; padding: 6px 4px;
  text-align: center; vertical-align: middle;
  position: relative;
}
/* colour dot only — no text in cells */
.dot {
  display: inline-block; width: 20px; height: 20px; border-radius: 4px;
  vertical-align: middle;
}
/* tooltip */
td.mc[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
  background: var(--col-head); color: #fff8f5; font-size: 10px; padding: 5px 9px;
  border-radius: 5px; white-space: nowrap; z-index: 200; pointer-events: none;
  box-shadow: 0 3px 10px rgba(0,0,0,.25); line-height: 1.5;
}
td.mc.has { cursor: pointer; }

/* Tfoot */
tfoot { position: sticky; bottom: 0; z-index: 20; }
tfoot td {
  border-top: 2px solid var(--border);
  background: #f8fafc !important;
  font-size: 11px; font-weight: 700;
}
tfoot td.cc  { color: var(--muted); font-size: 11px; }
tfoot td.mc  { color: var(--accent-dk); text-align: center; }

.loading { text-align: center; padding: 100px 0; color: var(--muted); font-size: 14px; }
.err { color: var(--warn); }
</style>
</head>
<body>

<header>
  <img class="logo" src="https://okiedokie-erp-images.s3.ap-south-1.amazonaws.com/Okie%20Dokie/2025/12/sourceURL/26aebcbe10f4ac5a3e8b-611ed1b9032568edd4f3-Okie_Dokie_App_icon__2___2_-removebg-preview.png" alt="OD">
  <div class="tb">
    <h1>Implementation Module Dashboard</h1>
    <div class="sub">Okie Dokie Campus Automation</div>
  </div>
  <div class="hstats" id="hstats"></div>
</header>

<div class="toolbar">
  <input id="clientQ" placeholder="🔍 Search client…" oninput="render()">
  <input id="modQ"    placeholder="🔍 Search module…" oninput="render()">

  <div class="sep"></div>

  <div class="pill-group">
    <button class="pill active" id="sName"  onclick="setSort('name')">Name</button>
    <button class="pill" id="sCount" onclick="setSort('count')">Modules ↕</button>
    <button class="pill" id="sDue"   onclick="setSort('due')">Due ↕</button>
  </div>

  <div class="sep"></div>

  <div class="min-filter">
    Show modules used by ≥
    <select id="minUse" onchange="render()">
      <option value="1">1 client</option>
      <option value="2" selected>2 clients</option>
      <option value="3">3 clients</option>
      <option value="5">5 clients</option>
    </select>
  </div>

  <div class="sep"></div>

  <div class="legend">
    <span class="li"><span class="swatch" style="background:#e8571a"></span>100%</span>
    <span class="li"><span class="swatch" style="background:#f4895a"></span>≥75%</span>
    <span class="li"><span class="swatch" style="background:#f9b899"></span>≥50%</span>
    <span class="li"><span class="swatch" style="background:#fde0d0"></span>&lt;50%</span>
    <span class="li"><span class="swatch" style="background:#fff0e8;border-color:#e8d4cb"></span>0 tasks</span>
    <span class="li"><span class="swatch" style="background:#f5f0ee;border-color:#ddd"></span>–</span>
  </div>

  <div class="spacer"></div>
  <button class="export-btn" onclick="exportCSV()">↓ Export CSV</button>
</div>

<div class="wrap">
  <div class="loading" id="loading">Loading data from Asana…</div>
  <table id="grid" style="display:none">
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
    <tfoot id="tfoot"></tfoot>
  </table>
</div>

<script>
// ── Normalisation ────────────────────────────────────────────────────────────
const MODULE_MAP = {
  'SIS':              ['sis', 'sis module', 'student information system'],
  'HRM':              ['hrm'],
  'HRM & Payroll':    ['hrm & payroll module'],
  'Fee':              ['fee', 'fee module', 'fees'],
  'Academic':         ['academic', 'academic module', 'academics', 'academic app'],
  'Library':          ['library', 'library module'],
  'Admission':        ['admission', 'admission module'],
  'Hostel':           ['hostel', 'hostel setup'],
  'Hostel & Transport': ['hostel & transport'],
  'Transport':        ['transport'],
  'COE':              ['coe', 'coe module'],
  'Communication':    ['communication', 'communication setup', 'employee communication'],
  'Front Desk':       ['front desk', 'front desk module'],
  'Examination':      ['examination', 'report card /examination', 'report card/examination'],
  'Time Table':       ['time table', 'timetable'],
  'Payroll':          ['payroll'],
  'Student App':      ['student app'],
  'Staff App':        ['staff app'],
  'Payment Gateway':  ['payment gateway', 'erp payment'],
  'PDF Templates':    ['pdf templates', 'pdf/excel templates', 'template pdf/excel',
                       'templates', 'pdf & excel templates', 'pdf'],
  'Attendance':       ['attendance'],
  'Biometric':        ['biometric'],
  'Zoho Forms':       ['zoho forms', 'zoho form'],
  'Gatepass':         ['gatepass'],
  'Integrations':     ['integrations'],
  'School Diary':     ['school diary'],
  'SMS/WhatsApp':     ['sms/whatsapp config.', 'sms/whatsapp', 'whatsapp'],
  'Website':          ['website development & maintenance', 'website'],
  'Gallery':          ['gallery'],
  'Student Certs':    ['student certificates', 'student certificate'],
  'Inventory':        ['inventory module', 'inventory'],
  'Lesson Plan':      ['lesson plan'],
  'Class Test':       ['class test'],
  'Feedback':         ['feedback module'],
  'Compliance':       ['compliance certificate', 'compliance'],
};
const ALIAS = {};
for (const [m, aa] of Object.entries(MODULE_MAP)) for (const a of aa) ALIAS[a] = m;

const SKIP = new Set([
  'getting started','modulewise implementation status','issues & requirements',
  'issues/requirements','visits','visit','module handover done','untitled section',
  'project status','implementation','daily queries','client queries',
  'customer onboarding','escalations','payment recovery','handover',
  'things to be covered during training','review','daily meeting (online)',
  'client calls for initiating setup','online meeting','module observation',
  'training','tranings','permission group','whtasapp','email set up',
  'requirement for development','landing page','session setup','setup on erp',
  'advanced module','student query','task','saraswati law college',
  'aggarwal law college - fee module','aggarwal law college - hrm module',
]);

function canon(raw) {
  const k = raw.trim().toLowerCase();
  return SKIP.has(k) ? null : (ALIAS[k] || raw.trim());
}

// ── State ────────────────────────────────────────────────────────────────────
let RAW = [], ALL_MODS = [], SORT = 'name', SORT_DIR = 1;
const today = new Date().toISOString().slice(0, 10);

function buildClients(raw) {
  return raw.map(c => {
    const mods = {};
    for (const s of c.sections) {
      const m = canon(s.name);
      if (!m) continue;
      if (!mods[m] || s.total > mods[m].total)
        mods[m] = { gid: s.gid, total: s.total, complete: s.complete };
    }
    return { name: c.name, gid: c.gid, due_on: c.due_on, owner: c.owner,
             mods, count: Object.keys(mods).length };
  });
}

function allMods(clients) {
  const freq = {};
  for (const c of clients) for (const m of Object.keys(c.mods)) freq[m] = (freq[m]||0)+1;
  return Object.keys(freq).sort((a,b) => freq[b]-freq[a] || a.localeCompare(b));
}

function setSort(k) {
  SORT_DIR = SORT === k ? -SORT_DIR : (k === 'count' ? -1 : 1);
  SORT = k;
  document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
  document.getElementById('s'+k[0].toUpperCase()+k.slice(1)).classList.add('active');
  render();
}

function sorted(clients) {
  return [...clients].sort((a,b) => {
    let v = 0;
    if (SORT==='name')  v = a.name.localeCompare(b.name);
    if (SORT==='count') v = b.count - a.count;
    if (SORT==='due')   v = (a.due_on||'9999') < (b.due_on||'9999') ? -1 : 1;
    return v * SORT_DIR;
  });
}

// Cell colour based on completion %
function dotColor(total, complete) {
  if (total === 0)              return '#fff0e8';   // added, no tasks
  const p = complete / total;
  if (p >= 1)    return '#e8571a';
  if (p >= 0.75) return '#f4895a';
  if (p >= 0.5)  return '#f9b899';
  return '#fde0d0';
}
function dotBorder(total, complete) {
  if (total === 0) return '#f4b49a';
  const p = complete / total;
  return p >= 0.5 ? 'rgba(0,0,0,.12)' : '#f4a87a';
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const cQ   = document.getElementById('clientQ').value.toLowerCase();
  const mQ   = document.getElementById('modQ').value.toLowerCase();
  const minU = parseInt(document.getElementById('minUse').value, 10);

  const clients = buildClients(RAW);
  const modFreq = {};
  for (const c of clients) for (const m of Object.keys(c.mods)) modFreq[m]=(modFreq[m]||0)+1;

  const visMods = ALL_MODS.filter(m =>
    m.toLowerCase().includes(mQ) && (modFreq[m]||0) >= minU
  );
  const visClients = sorted(clients.filter(c => c.name.toLowerCase().includes(cQ)));

  // thead
  const thead = document.getElementById('thead');
  thead.innerHTML = '';
  const hr = document.createElement('tr');
  const corner = document.createElement('th');
  corner.className = 'corner';
  corner.textContent = 'Client · Owner · Due';
  hr.appendChild(corner);

  const modUsage = {};
  for (const m of visMods) {
    modUsage[m] = visClients.filter(c => c.mods[m]).length;
    const th = document.createElement('th');
    th.className = 'mh';
    th.title = `${m} — ${modUsage[m]} clients`;
    th.innerHTML = `<div class="rot">${m}<span class="cnt">${modUsage[m]}</span></div>`;
    hr.appendChild(th);
  }
  thead.appendChild(hr);

  // tbody
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const totals = {};
  for (const m of visMods) totals[m] = 0;

  for (const c of visClients) {
    const visCount = visMods.filter(m => c.mods[m]).length;
    const tr = document.createElement('tr');
    if (c.count < 3) tr.classList.add('attn');

    // Client cell
    const tc = document.createElement('td');
    tc.className = 'cc';
    const url = `https://app.asana.com/0/${c.gid}/list`;
    let meta = '';
    if (c.owner) meta += `<span class="owner">👤 ${c.owner}</span>`;
    if (c.due_on) {
      const ov = c.due_on < today;
      meta += `<span class="due${ov?' ov':''}">${ov?'⚠ ':''}${c.due_on}</span>`;
    }
    tc.innerHTML =
      `<a href="${url}" target="_blank" rel="noopener">${c.name}</a>` +
      `<span class="nbadge">${visCount}</span>` +
      (meta ? `<div class="cmeta">${meta}</div>` : '');
    tr.appendChild(tc);

    // Module cells
    for (const m of visMods) {
      const td = document.createElement('td');
      td.className = 'mc';
      const info = c.mods[m];
      if (info) {
        td.classList.add('has');
        const pct = info.total > 0 ? Math.round(info.complete/info.total*100) : null;
        const tip = info.total > 0
          ? `${m}\n${info.complete}/${info.total} tasks · ${pct}%`
          : `${m}\nSection added · no tasks yet`;
        td.setAttribute('data-tip', tip);
        td.style.background = '#fffaf7';
        const color  = dotColor(info.total, info.complete);
        const border = dotBorder(info.total, info.complete);
        td.innerHTML = `<span class="dot" style="background:${color};border:1px solid ${border}"></span>`;
        td.onclick = () => window.open(url, '_blank');
        totals[m]++;
      } else {
        td.innerHTML = `<span style="color:#ddd;font-size:11px">–</span>`;
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }

  // tfoot
  const tfoot = document.getElementById('tfoot');
  tfoot.innerHTML = '';
  const tf = document.createElement('tr');
  const tfc = document.createElement('td');
  tfc.className = 'cc';
  tfc.textContent = `Clients using module  (${visClients.length} shown)`;
  tf.appendChild(tfc);
  for (const m of visMods) {
    const td = document.createElement('td');
    td.className = 'mc';
    td.textContent = totals[m];
    tf.appendChild(td);
  }
  tfoot.appendChild(tf);

  document.getElementById('hstats').innerHTML =
    `<span>${visClients.length} <b>clients</b></span><span>${visMods.length} <b>modules</b></span>`;
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportCSV() {
  const cQ   = document.getElementById('clientQ').value.toLowerCase();
  const mQ   = document.getElementById('modQ').value.toLowerCase();
  const minU = parseInt(document.getElementById('minUse').value, 10);
  const clients = buildClients(RAW);
  const modFreq = {};
  for (const c of clients) for (const m of Object.keys(c.mods)) modFreq[m]=(modFreq[m]||0)+1;
  const mods = ALL_MODS.filter(m => m.toLowerCase().includes(mQ) && (modFreq[m]||0) >= minU);
  const vis  = sorted(clients.filter(c => c.name.toLowerCase().includes(cQ)));
  const e = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const rows = [['Client','Owner','Due Date','Module Count',...mods].map(e).join(',')];
  for (const c of vis) {
    rows.push([c.name,c.owner||'',c.due_on||'',c.count,
      ...mods.map(m => {
        const i = c.mods[m];
        return !i ? '' : i.total > 0 ? `${i.complete}/${i.total}` : 'added';
      })].map(e).join(','));
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download = `impl-modules-${today}.csv`;
  a.click();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
fetch('/api/modules')
  .then(r => r.json())
  .then(d => {
    if (!d.ok) throw new Error(d.error);
    RAW = d.clients;
    ALL_MODS = allMods(buildClients(RAW));
    document.getElementById('loading').style.display = 'none';
    document.getElementById('grid').style.display = '';
    render();
  })
  .catch(e => {
    document.getElementById('loading').innerHTML =
      `<span class="err">Failed to load: ${e.message}</span>`;
  });
</script>
</body>
</html>
